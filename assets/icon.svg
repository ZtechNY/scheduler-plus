<?xml version="1.0" encoding="UTF-8"?>
<!--
  Scheduler+ brand mark ("Switch Mark"): two rocker switches in opposite
  states, badged with a plus. Source of truth for the icon used in
  scheduler-plus-card.ts's card header (there rendered with theme-aware
  colors via CSS custom properties); this file freezes the same geometry
  at fixed colors so it can be rasterized independently of any theme.

  Not read by Home Assistant or HACS automatically - it's a design source
  file only. If Scheduler+ is ever submitted to home-assistant/brands,
  export this at 256x256 as icon.png and 512x512 as icon@2x.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="256" height="256" role="img" aria-label="Scheduler+">
  <title>Scheduler+</title>
  <rect x="9" y="13" width="34" height="14" rx="7" fill="#FFFFFF" stroke="#14181F" stroke-width="4"/>
  <circle cx="37" cy="20" r="8.5" fill="#14181F"/>
  <rect x="9" y="31" width="34" height="14" rx="7" fill="#FFFFFF" stroke="#14181F" stroke-width="4"/>
  <circle cx="15" cy="38" r="8.5" fill="#14181F"/>
  <circle cx="47" cy="47" r="12" fill="#F2A93B" stroke="#FFFFFF" stroke-width="3.5"/>
  <line x1="41" y1="47" x2="53" y2="47" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="47" y1="41" x2="47" y2="53" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
